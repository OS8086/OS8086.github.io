<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS8086</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070a10;
            --card-bg: #0f1420;
            --border-color: #1a2333;
            --text-main: #f0f4f8;
            --text-muted: #6272a4;
            --accent: #ff5555; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            text-align: center;
            max-width: 650px;
            width: 100%;
        }


        .identity {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        .identity span {
            color: var(--accent);
        }


        .role {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 35px;
        }


        .links-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .links-container a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            transition: all 0.2s ease;
        }

        .links-container a:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }


        .links-container .cv-btn {
            background: rgba(255, 85, 85, 0.1);
            border-color: rgba(255, 85, 85, 0.4);
            color: var(--accent);
            font-weight: 700;
        }
        .links-container .cv-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }


        .future-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .future-box {
            background: rgba(15, 20, 32, 0.5);
            border: 1px dashed var(--border-color);
            padding: 20px;
            border-radius: 6px;
            text-align: left;
            transition: border-color 0.3s;
        }

        .future-box h3 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .future-box h3 span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .future-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 60px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 500px) {
            .identity { font-size: 2.2rem; }
            .future-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <h1 class="identity">OS8086<span>_</span></h1>
        <p class="role">Security Researcher & Bug Bounty Hunter</p>


        <div class="links-container">
            <a href="/cv.pdf" class="cv-btn" target="_blank">CV</a>
            <a href="https://hackerone.com/OS8086" target="_blank">HackerOne</a>
            <a href="https://bugcrowd.com/os8086" target="_blank">Bugcrowd</a> 
            <a href="https://www.youtube.com/@OS8086x" target="_blank">Youtube</a>
            <a href="https://github.com/os8086" target="_blank">GitHub</a>
            <a href="https://twitter.com/os8086x" target="_blank">X.com</a>
            <a href="mailto:osama.infosec@gmail.com">Email</a>

        </div>



        <div class="future-grid">
            <div class="future-box">
                <h3>Certificates</h3>
                <p>...</p>
            </div>
            
            <div class="future-box">
                <h3>CVEs</h3>
                <p>...</p>
            </div>
        </div>

        <footer>
            <p class="mono">root@os8086:~# exit</p>
        </footer>
    </div>

</body>
</html>
